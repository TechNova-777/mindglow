<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow AI — MindGlow Ultra Pro</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Cabecera Avanzada */
        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
            position: relative;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #23d5ab;
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            box-shadow: 0 0 8px #23d5ab;
        }

        .header-text {
            text-align: left;
        }

        .header-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.2;
            margin: 0;
        }

        .header-text .status-text {
            font-size: 0.75rem;
            color: #718096;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.05);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #764ba2;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .action-btn:hover {
            background: #ffffff;
            transform: scale(1.08);
            color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        /* Tarjeta de Bienvenida */
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            margin-bottom: 10px;
        }

        .welcome-card h2 {
            font-size: 1rem;
            color: #2d3436;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .welcome-card p {
            font-size: 0.88rem;
            color: #636e72;
            line-height: 1.4;
        }

        .badge-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .badge-item {
            background: #f0f3ff;
            color: #667eea;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Botones Rápidos / Chips */
        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Entrada de texto con botones secundarios */
        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-icon-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .input-icon-btn:hover {
            color: #667eea;
        }
    </style>
</head>
<body>

    <main id="chat-container">
        
        <header id="chat-header">
            <div class="header-info">
                <div class="ai-avatar">
                    <i class="ph-fill ph-sparkle"></i>
                    <span class="status-dot"></span>
                </div>
                <div class="header-text">
                    <h1>Glow AI</h1>
                    <span class="status-text">
                        <i class="ph-fill ph-circle"></i> En línea • MindGlow
                    </span>
                </div>
            </div>

            <div class="header-actions">
                <button class="action-btn" id="clear-chat-btn" title="Reiniciar chat">
                    <i class="ph-bold ph-arrows-clockwise"></i>
                </button>
            </div>
        </header>

        <section id="chat-messages" aria-live="polite">
            
            <article class="welcome-card">
                <h2><i class="ph-fill ph-robot" style="color: #667eea;"></i> ¡Hola, bienvenido!</h2>
                <p>Soy tu asistente <strong>Glow AI</strong>. Estoy aquí para ayudarte a organizarte, relajarte o responder lo que necesites.</p>
                <div class="badge-list">
                    <span class="badge-item"><i class="ph-fill ph-lightning"></i> Rápido</span>
                    <span class="badge-item"><i class="ph-fill ph-brain"></i> Inteligente</span>
                    <span class="badge-item"><i class="ph-fill ph-heartbeat"></i> Bienestar</span>
                </div>
            </article>

            <div id="typing-indicator" class="hidden">
                <article class="message ai-message">
                    <div class="message-content typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </article>
            </div>

        </section>

        <nav id="quick-replies" aria-label="Respuestas rápidas">
            <button class="quick-btn" onclick="sendQuickMessage('👋 ¡Hola Glow!')">
                <i class="ph-fill ph-hand-waving"></i> Hola
            </button>
            <button class="quick-btn" onclick="sendQuickMessage('🤯 Tengo estrés por las tareas')">
                <i class="ph-fill ph-brain"></i> Estrés
            </button>
            <button class="quick-btn" onclick="sendQuickMessage('🌱 Dame un consejo de estudio')">
                <i class="ph-fill ph-plant"></i> Tips
            </button>
            <button class="quick-btn" onclick="sendQuickMessage('⚡ Dame motivación para hoy')">
                <i class="ph-fill ph-lightning"></i> Ánimo
            </button>
            <button class="quick-btn" onclick="sendQuickMessage('😂 Cuéntame algo divertido')">
                <i class="ph-fill ph-smiley"></i> Chill
            </button>
        </nav>

        <form id="chat-form">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="chat-input" 
                    placeholder="Escribe un mensaje..." 
                    autocomplete="off" 
                    required 
                />
            </div>
            <button type="submit" id="send-btn" title="Enviar">
                <i class="ph-fill ph-paper-plane-tilt"></i>
            </button>
        </form>

    </main>

    <script src="script.js"></script>
</body>
</html>
